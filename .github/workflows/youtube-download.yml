name: Daily Channel Sync (API Trigger)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Server Sync
        run: |
          echo "Triggering background channel sync on Render..."
          curl -sS -X GET "https://musicapp-ju7o.onrender.com/status/trigger-sync"
