name: Daily Channel Sync (API Trigger)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Server Sync
        run: |
          if [ -z "${{ secrets.RENDER_API_BASE_URL }}" ]; then
            echo "Error: RENDER_API_BASE_URL secret is not set."
            exit 1
          fi
          echo "Triggering background channel sync on Render..."
          curl -sS -X GET "${{ secrets.RENDER_API_BASE_URL }}/status/trigger-sync"
