name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Render server to prevent spin-down..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "https://musicapp-ju7o.onrender.com/health")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Server is awake (Status: $HTTP_STATUS)."
          else
            echo "Failed to reach server (Status: $HTTP_STATUS)."
          fi
