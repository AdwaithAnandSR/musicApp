services:
  - type: web
    name: vividmusic-backend
    runtime: node
    rootDir: server
    region: oregon
    plan: free
    buildCommand: ./render-build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: VIVID_MUSIC_API_BASE
        value: https://vivid-music.vercel.app/temp
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
